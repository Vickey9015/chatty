# Nginx reverse proxy for ChitChat
# 1. Copy: sudo cp deploy/nginx-chatty.conf /etc/nginx/sites-available/chatty
# 2. Edit server_name and paths
# 3. Enable: sudo ln -s /etc/nginx/sites-available/chatty /etc/nginx/sites-enabled/
# 4. SSL: sudo certbot --nginx -d yourdomain.com
# 5. Reload: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
